<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Memory Study</title>

  <style>
    :root {
      --lime: #c1db43;
      --cream: #fffbe8;
      --ink: #111111;
      --ink-soft: rgba(17, 17, 17, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.45;
    }

    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 28px 16px 48px;
    }

    /* progress */
    .progress {
      height: 6px;
      background: var(--ink-soft);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--ink);
      transition: width 0.4s ease;
    }

    /* the lime card */
    .card {
      background: var(--lime);
      min-height: 380px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
      outline: none;
    }

    .card h1 { font-size: 1.6rem; margin: 0; line-height: 1.2; }
    .card p  { margin: 0; max-width: 56ch; }
    .copy { display: flex; flex-direction: column; gap: 14px; align-items: center; }
    .small { font-size: 0.9rem; }

    .question { font-size: 1.2rem; font-weight: 600; max-width: 48ch; }
    .statement { font-size: 1.3rem; font-weight: 600; }

    /* images */
    .stage img { max-width: 100%; max-height: 270px; display: block; }
    .qimg { max-height: 150px; max-width: 70%; display: block; }
    .placeholder {
      border: 2px dashed var(--ink);
      padding: 28px 22px;
      font-size: 0.85rem;
      border-radius: 10px;
      word-break: break-all;
    }

    /* buttons */
    .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

    .btn {
      font: inherit;
      font-weight: 600;
      background: transparent;
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 0.6em 1.6em;
      cursor: pointer;
    }
    .btn:hover { background: var(--ink); color: var(--lime); }
    .btn:focus-visible,
    .pair:focus-visible,
    .next:focus-visible,
    .conf button:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    .pair {
      font: inherit;
      background: transparent;
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
    }
    .pair:hover { border-color: var(--ink); }
    .pair img { max-height: 130px; max-width: 220px; display: block; }

    .conf { display: flex; gap: 36px; justify-content: center; }
    .conf button {
      font: inherit;
      background: transparent;
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 8px 20px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .conf button:hover { border-color: var(--ink); }
    .conf strong { font-size: 2.2rem; font-weight: 800; line-height: 1.1; }
    .conf span { font-size: 0.85rem; }

    .next {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 4px;
      border-radius: 8px;
    }
    .next svg { width: 56px; height: 26px; display: block; }

    /* forms */
    .form { display: flex; flex-direction: column; gap: 14px; width: min(420px, 100%); text-align: left; }
    .form label { font-weight: 600; font-size: 0.95rem; display: flex; flex-direction: column; gap: 6px; }
    .form input, .form select, .form textarea, textarea.answer {
      font: inherit;
      padding: 10px 12px;
      border: 2px solid var(--ink);
      border-radius: 10px;
      background: var(--cream);
      color: var(--ink);
    }
    textarea.answer { width: min(480px, 100%); min-height: 90px; resize: vertical; }

    /* countdown bar */
    .timer {
      width: min(420px, 90%);
      height: 6px;
      background: var(--ink-soft);
      border-radius: 6px;
      overflow: hidden;
    }
    .timer i {
      display: block;
      height: 100%;
      background: var(--ink);
      transform-origin: left center;
      animation-name: shrink;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }
    @keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    @media (max-width: 520px) {
      .card { padding: 24px 16px; min-height: 340px; }
      .conf { gap: 10px; }
      .pair img { max-width: 130px; }
    }
  </style>
</head>

<body>
  <main>
    <div class="progress" aria-hidden="true"><span id="bar"></span></div>
    <section id="card" class="card" tabindex="-1" aria-live="polite">
      <noscript>This study needs JavaScript. Please turn it on and reload the page.</noscript>
    </section>
  </main>

  <script>
    /* =====================================================================
       SETTINGS
       ===================================================================== */
    const CONFIG = {
      ENDPOINT: 'https://script.google.com/macros/s/AKfycbz7spV9mZ3m3HVzLVaj8yLZtk0BpFqkvqPmpCJKyneUkvtApzY-M1y_Hje0TnMGfqkr/exec',          // paste your Google Apps Script web app URL here (see the data-collection step)
      IMAGE_MS: 2000,        // how long each image stays on screen
      QUESTION_MS: 4000,     // time limit for true/false and choice questions
      DEBUG: false            // logs each response in the browser console; set to false when you launch
    };

    /* =====================================================================
       ITEMS (fixed order, exactly as in your design)
       images:     shown one after another for IMAGE_MS each, BEFORE the question
       prime:      optional true/false statement shown after the images
       kind:       'tf' (True/False) | 'lr' (Left/Right) | 'pair' (pick one of two pictures) | 'text' (typed)
       condition:  a label saved with your data so you can group items later
       Option ids for 'pair' items describe what the picture looks like. They are
       saved with the data, so no answer key is stored in this file.
       ===================================================================== */
    const ITEMS = [
      { id: 'apple', condition: 'lure', images: ['images/apple.png'], kind: 'tf',
        question: 'Is the icon you just saw correct for Apple Inc.?' },

      { id: 'george_tail', condition: 'lure', images: ['images/george.png'],
        prime: { id: 'monkeys_tails', text: 'All monkeys have tails' },
        kind: 'tf', question: 'Does Curious George have a tail in the original?' },

      { id: 'pooh_tail', condition: 'lure', images: ['images/bear.png', 'images/pooh.png'], kind: 'tf',
        question: 'Does Winnie the Pooh have a tail in the original?' },

      { id: 'subtitles_icon', condition: 'choice', kind: 'pair',
        question: 'Which one holds true for the \u2018subtitles\u2019 icon?',
        options: [
          { id: 'cc_standard', img: 'images/cc_standard.png' },
          { id: 'cc_mirrored', img: 'images/cc_mirrored.png' }
        ] },

      { id: 'image_icon', condition: 'choice', kind: 'pair',
        question: 'Which one holds true for the \u2018image\u2019 icon?',
        options: [
          { id: 'sun_top_right', img: 'images/image_sun_right.png' },
          { id: 'sun_top_left',  img: 'images/image_sun_left.png' }
        ] },

      { id: 'star_symbol', condition: 'typed', kind: 'text', questionImage: 'images/star.png',
        question: 'What does this symbol mean for you on your device?' },

      { id: 'amazon', condition: 'choice', kind: 'pair',
        question: 'Which icon is correct for Amazon Inc.?',
        options: [
          { id: 'amazon_arrow_right', img: 'images/amazon_arrow_right.png' },
          { id: 'amazon_arrow_left',  img: 'images/amazon_arrow_left.png' }
        ] },

      { id: 'youtube', condition: 'choice', kind: 'pair',
        question: 'Which icon is correct for YouTube Inc.?',
        options: [
          { id: 'youtube_play_right', img: 'images/youtube_play_right.png' },
          { id: 'youtube_play_left',  img: 'images/youtube_play_left.png' }
        ] },

      { id: 'windows_icon', condition: 'typed', kind: 'text', questionImage: 'images/windows.png',
        question: 'Do you remember this icon?' },

      { id: 'x_icon', condition: 'typed', kind: 'text', questionImage: 'images/x.png',
        question: 'What\u2019s the role of this icon?' },

      { id: 'hello_kitty_mouth', condition: 'lure', images: ['images/hello_kitty.png'],
        prime: { id: 'cats_mouth', text: 'All cats have mouth' },
        kind: 'tf', question: 'Does \u2018Hello Kitty\u2019 have a mouth in the original?' },

      { id: 'lincoln_penny', condition: 'lure', images: ['images/penny.png'], kind: 'lr',
        question: 'Which way does Lincoln face in the original?' },

      { id: 'statue_flame', condition: 'lure', images: ['images/statue.png'], kind: 'lr',
        question: 'Which hand holds the flame in the Statue of Liberty?' },

      { id: 'mickey_suspenders', condition: 'lure', images: ['images/goofy.png', 'images/mickey.png'], kind: 'tf',
        question: 'Does Mickey Mouse wear suspenders in the original?' },

      { id: 'lumiere_hands', condition: 'lure', images: ['images/chandelier.png'], kind: 'tf',
        questionImage: 'images/lumiere.png',
        question: '\u2018Lumiere\u2019 has three hands in the Beauty and the Beast original' }
    ];

    /* =====================================================================
       HELPERS
       ===================================================================== */
    const $card = document.getElementById('card');
    const $bar  = document.getElementById('bar');

    const participantId = (window.crypto && crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now()) + Math.random().toString(16).slice(2)
    ).slice(0, 8);

    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const shuffle = arr => {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    };

    const ARROW = '<svg viewBox="0 0 56 26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14 C 18 11, 34 13, 52 13"/><path d="M42 3 L 53 13 L 41 23"/></svg>';

    // If an image file is missing, show its filename so you can still test the flow.
    $card.addEventListener('error', e => {
      if (e.target.tagName === 'IMG') {
        const ph = document.createElement('div');
        ph.className = 'placeholder';
        ph.textContent = 'Missing image: ' + e.target.getAttribute('src');
        e.target.replaceWith(ph);
      }
    }, true);

    const img = (src, cls = '') => '<img class="' + cls + '" src="' + esc(src) + '" alt="">';

    function render(html) {
      $card.innerHTML = html;
      window.scrollTo(0, 0);
      $card.focus({ preventScroll: true });
    }

    function timerBar(ms) {
      return '<div class="timer" aria-hidden="true"><i style="animation-duration:' + ms + 'ms"></i></div>';
    }

    // Resolves with the data-value of the clicked button, or null if time runs out.
    function waitForButton(timeoutMs) {
      return new Promise(resolve => {
        let timer = null;
        const onClick = e => {
          const b = e.target.closest('button[data-value]');
          if (!b) return;
          cleanup();
          resolve(b.dataset.value);
        };
        const cleanup = () => {
          $card.removeEventListener('click', onClick);
          clearTimeout(timer);
        };
        $card.addEventListener('click', onClick);
        if (timeoutMs) timer = setTimeout(() => { cleanup(); resolve(null); }, timeoutMs);
      });
    }

    function setProgress(done, total) {
      $bar.style.width = Math.round((done / total) * 100) + '%';
    }

    /* =====================================================================
       DATA
       ===================================================================== */
let saveData = true;   // becomes false in test mode

function send(trials) {
  if (!saveData) {
    if (CONFIG.DEBUG) console.log('test mode, not saved', trials);
    return;
  }
  const payload = { participantId, trials };
  if (CONFIG.DEBUG) console.log('data', payload);
  if (!CONFIG.ENDPOINT) return;
  fetch(CONFIG.ENDPOINT, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).catch(() => {});
}

    /* =====================================================================
       SCREENS
       ===================================================================== */
    async function infoScreen(html, label) {
      const btn = label
        ? '<button class="btn" data-value="go">' + label + '</button>'
        : '<button class="next" data-value="go" aria-label="Continue">' + ARROW + '</button>';
      render('<div class="copy">' + html + '</div>' + btn);
      await waitForButton();
    }

    async function showImage(src) {
      render('<div class="stage">' + img(src) + '</div>' + timerBar(CONFIG.IMAGE_MS));
      await sleep(CONFIG.IMAGE_MS);
    }

    function questionMarkup(question, image) {
      return (image ? img(image, 'qimg') : '') + '<p class="question">' + esc(question) + '</p>';
    }

    // True/False or Left/Right. Returns { value, rt } (value is null on timeout).
    async function askButtons(text, labels, image, isStatement) {
      const buttons = labels.map(l => '<button class="btn" data-value="' + l + '">' + l + '</button>').join('');
      const head = isStatement ? '<p class="statement">' + esc(text) + '</p>' : questionMarkup(text, image);
      render(head + '<div class="row">' + buttons + '</div>' + timerBar(CONFIG.QUESTION_MS));
      const t0 = performance.now();
      const value = await waitForButton(CONFIG.QUESTION_MS);
      return { value, rt: Math.round(performance.now() - t0) };
    }

    // Pick one of two pictures (position is randomized).
    async function askPair(item) {
      const opts = shuffle(item.options).map(o =>
        '<button class="pair" data-value="' + o.id + '">' + img(o.img) + '</button>').join('');
      render('<p class="question">' + esc(item.question) + '</p><div class="row">' + opts + '</div>' + timerBar(CONFIG.QUESTION_MS));
      const t0 = performance.now();
      const value = await waitForButton(CONFIG.QUESTION_MS);
      return { value, rt: Math.round(performance.now() - t0) };
    }

    // Typed answer, no time limit.
    async function askText(item) {
      render(questionMarkup(item.question, item.questionImage) +
        '<textarea class="answer" id="typed" aria-label="Your answer" placeholder="Type your response here"></textarea>' +
        '<button class="btn" data-value="go">Continue</button>');
      const t0 = performance.now();
      await waitForButton();
      return { value: document.getElementById('typed').value.trim(), rt: Math.round(performance.now() - t0) };
    }

    async function askConfidence() {
      render('<p class="question">Rate your confidence</p>' +
        '<div class="conf">' +
          '<button data-value="1"><strong>1</strong><span>guessing</span></button>' +
          '<button data-value="2"><strong>2</strong><span>fairly sure</span></button>' +
          '<button data-value="3"><strong>3</strong><span>100% sure</span></button>' +
        '</div>');
      return Number(await waitForButton());
    }

    async function timeUp() {
      render('<p class="question">Time\u2019s up.</p>');
      await sleep(900);
    }

    /* =====================================================================
       ONE ITEM
       ===================================================================== */
    async function runItem(item) {
      // 1. lure image(s)
      for (const src of (item.images || [])) await showImage(src);

      // 2. optional true/false statement (saved, no confidence rating)
      if (item.prime) {
        const p = await askButtons(item.prime.text, ['True', 'False'], null, true);
        send([{ itemId: 'prime_' + item.prime.id, condition: 'prime',
                answer: p.value === null ? 'timeout' : p.value, confidence: '', rtMs: p.rt }]);
        if (p.value === null) await timeUp();
      }

      // 3. the question
      let res;
      if (item.kind === 'tf')        res = await askButtons(item.question, ['True', 'False'], item.questionImage);
      else if (item.kind === 'lr')   res = await askButtons(item.question, ['Left', 'Right'], item.questionImage);
      else if (item.kind === 'pair') res = await askPair(item);
      else                           res = await askText(item);

      if (res.value === null) {
        await timeUp();
        send([{ itemId: item.id, condition: item.condition, answer: 'timeout', confidence: '', rtMs: res.rt }]);
        return;
      }

      // 4. confidence
      const confidence = await askConfidence();
      send([{ itemId: item.id, condition: item.condition, answer: res.value, confidence, rtMs: res.rt }]);
    }

    /* =====================================================================
       THE STUDY
       ===================================================================== */
    function preload() {
      const srcs = new Set();
      ITEMS.forEach(it => {
        (it.images || []).forEach(s => srcs.add(s));
        if (it.questionImage) srcs.add(it.questionImage);
        (it.options || []).forEach(o => srcs.add(o.img));
      });
      srcs.forEach(s => { const i = new Image(); i.src = s; });
    }

    async function main() {
      preload();
      setProgress(0, ITEMS.length);

      // Consent
      await infoScreen(
        '<h1>Icon memory study</h1>' +
        '<p>This is a short study (about 5 minutes) for a final research project in COGS 080 at Dartmouth College. ' +
        'You will see some images and answer questions about them.</p>' +
        '<p>Your answers are anonymous and you can stop at any time by closing this page. ' +
        'Please don\u2019t look anything up while you answer.</p>' +
        '<p class="small">Questions?: aynura.m.erejepbaeva.28@dartmouth.edu</p>',
        'Start the study');

      // Instructions
      await infoScreen(
        '<p class="question">You\u2019ll see some images and answer questions.<br>Answer about the original version of each item.</p>' +
        '<p>You will have ' + (CONFIG.IMAGE_MS / 1000) + ' seconds to look at each image and ' +
        (CONFIG.QUESTION_MS / 1000) + ' seconds to answer each true/false or choice question. ' +
        'Typed answers are not timed. After each answer, you will rate how confident you are.</p>');

      // Personal questions
      render(
        '<p class="question">Answer these personal questions</p>' +
        '<div class="form">' +
          '<label>How much time do you spend on screen per day?' +
            '<select id="screen"><option value="">Choose one</option>' +
            '<option>Less than 2 hours</option><option>2\u20134 hours</option><option>4\u20136 hours</option>' +
            '<option>6\u20138 hours</option><option>More than 8 hours</option></select></label>' +
          '<label>Age (optional)<input id="age" type="number" min="18" max="120" inputmode="numeric"></label>' +
          '<label>Gender (optional)' +
            '<select id="gender"><option value="">Choose one</option><option>Woman</option><option>Man</option>' +
            '<option>Non-binary</option><option>Prefer to self-describe</option><option>Prefer not to say</option></select></label>' +
        '</div>' +
        '<button class="next" data-value="go" aria-label="Continue">' + ARROW + '</button>');
      await waitForButton();
      const screenTime = document.getElementById('screen').value;
      const age = document.getElementById('age').value;
      const gender = document.getElementById('gender').value;
      saveData = Boolean(screenTime || age || gender);   // all blank = test mode
      send([{ itemId: 'demographics', condition: 'info', confidence: '', rtMs: '',
              answer: JSON.stringify({ screenTime, age, gender }) }]);

      // Items
      for (let i = 0; i < ITEMS.length; i++) {
        await runItem(ITEMS[i]);
        setProgress(i + 1, ITEMS.length);
      }

      // Open-ended questions
      render(
        '<div class="form">' +
          '<label>How did you come up with your answers?<textarea class="answer" id="how"></textarea></label>' +
          '<label>Did the provided images influence your answers?<textarea class="answer" id="infl"></textarea></label>' +
        '</div>' +
        '<button class="btn" data-value="go">Finish</button>');
      await waitForButton();
      send([
        { itemId: 'open_how', condition: 'open', answer: document.getElementById('how').value.trim(), confidence: '', rtMs: '' },
        { itemId: 'open_influence', condition: 'open', answer: document.getElementById('infl').value.trim(), confidence: '', rtMs: '' }
      ]);

      // Debrief
      render(
        '<div class="copy"><h1>Thank you!</h1>' +
        '<p>Some of the images you saw were edited and changed on purpose. We are studying whether a perception of an icon and recency ' +
        'override the original memory.</p>' +
        '<p>There are no right or wrong answers here. False memories tend to exist because of the way our brains process and store information. ' +
        'You can close this page now.</p></div>');
    }

    main();
  </script>
</body>
</html>
