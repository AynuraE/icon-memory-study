<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Memory Study</title>

  <style>
    :root {
      --lime: #c1db43;
      --cream: #fffbe8;
      --ink: #111111;
      --ink-soft: rgba(17, 17, 17, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.45;
    }

    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 28px 16px 48px;
    }

    /* progress */
    .progress {
      height: 6px;
      background: var(--ink-soft);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--ink);
      transition: width 0.4s ease;
    }

    /* the lime card */
    .card {
      background: var(--lime);
      min-height: 380px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
      outline: none;
    }

    .card h1 { font-size: 1.6rem; margin: 0; line-height: 1.2; }
    .card p  { margin: 0; max-width: 56ch; }
    .copy { display: flex; flex-direction: column; gap: 14px; align-items: center; }
    .small { font-size: 0.9rem; }

    .question { font-size: 1.2rem; font-weight: 600; max-width: 48ch; }
    .statement { font-size: 1.3rem; font-weight: 600; }

    /* images */
    .placeholder {
      border: 2px dashed var(--ink);
      padding: 28px 22px;
      font-size: 0.85rem;
      border-radius: 10px;
      word-break: break-all;
    }

    /* three pictures on one screen */
    .pics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }
    .pic {
      font: inherit;
      background: transparent;
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pic:hover { border-color: var(--ink); }
    .pic img { width: 100%; max-height: 300px; object-fit: contain; display: block; }

    /* buttons */
    .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

    .btn {
      font: inherit;
      font-weight: 600;
      background: transparent;
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 0.6em 1.6em;
      cursor: pointer;
    }
    .btn:hover { background: var(--ink); color: var(--lime); }
    .btn:focus-visible,
    .pic:focus-visible,
    .next:focus-visible,
    .conf button:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    /* confidence 1-5 */
    .conf { display: flex; gap: 22px; justify-content: center; }
    .conf button {
      font: inherit;
      background: transparent;
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 6px 18px;
      cursor: pointer;
    }
    .conf button:hover { border-color: var(--ink); }
    .conf strong { font-size: 2.6rem; font-weight: 800; line-height: 1.1; }
    .conf-labels {
      display: flex;
      justify-content: space-between;
      width: min(420px, 100%);
      font-size: 0.95rem;
    }

    .next {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 4px;
      border-radius: 8px;
    }
    .next svg { width: 56px; height: 26px; display: block; }

    /* forms */
    .form { display: flex; flex-direction: column; gap: 14px; width: min(420px, 100%); text-align: left; }
    .form label { font-weight: 600; font-size: 0.95rem; display: flex; flex-direction: column; gap: 6px; }
    .form input, .form select, .form textarea, textarea.answer {
      font: inherit;
      padding: 10px 12px;
      border: 2px solid var(--ink);
      border-radius: 10px;
      background: var(--cream);
      color: var(--ink);
    }
    textarea.answer { width: min(480px, 100%); min-height: 90px; resize: vertical; }

    /* countdown bar (only used if TRIAL_MS is set) */
    .timer {
      width: min(420px, 90%);
      height: 6px;
      background: var(--ink-soft);
      border-radius: 6px;
      overflow: hidden;
    }
    .timer i {
      display: block;
      height: 100%;
      background: var(--ink);
      transform-origin: left center;
      animation-name: shrink;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }
    @keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    @media (max-width: 620px) {
      .card { padding: 24px 16px; min-height: 340px; }
      .pics { grid-template-columns: 1fr; gap: 8px; }
      .pic img { max-height: 190px; }
      .conf { gap: 6px; }
      .conf button { padding: 6px 12px; }
    }
  </style>
</head>

<body>
  <main>
    <div class="progress" aria-hidden="true"><span id="bar"></span></div>
    <section id="card" class="card" tabindex="-1" aria-live="polite">
      <noscript>This study needs JavaScript. Please turn it on and reload the page.</noscript>
    </section>
  </main>

  <script>
    /* =====================================================================
       SETTINGS
       ===================================================================== */
    const CONFIG = {
      ENDPOINT: 'https://script.google.com/macros/s/AKfycbz7spV9mZ3m3HVzLVaj8yLZtk0BpFqkvqPmpCJKyneUkvtApzY-M1y_Hje0TnMGfqkr/exec',
      TRIAL_MS: 0,           // time limit per picture question in milliseconds; 0 = no time limit (e.g. 10000 = 10 seconds)
      IMAGE_EXT: 'png',      // file type of your images (png, jpg, ...)
      DEBUG: false           // logs each response in the browser console; keep false when you launch
    };

    /* =====================================================================
       THE THREE VERSIONS OF EVERY CHARACTER
       label = what gets saved in your data
       file  = the ending of the image file name, e.g. images/george_true.png
       ===================================================================== */
    const VERSIONS = [
      { label: 'original',    file: 'true' },
      { label: 'schema',      file: 'schema' },
      { label: 'superficial', file: 'superficial' }
    ];

    /* =====================================================================
       ITEMS (fixed order). Each one needs three files in the images folder:
       images/<id>_true.png, images/<id>_schema.png, images/<id>_superficial.png
       ===================================================================== */
    const ITEMS = [
      { id: 'george', question: 'Which one is the original George in Curious George?' },
      { id: 'kitty',  question: 'Which one is the original Kitty in Hello Kitty?' },
      { id: 'pooh',   question: 'Which one is the original Pooh in the Winnie the Pooh?' },
      { id: 'mickey', question: 'Which one is the original Mickey in Mickey Mouse?' },
      { id: 'donald', question: 'Which one is the original Donald Duck in Mickey Mouse?' },
      { id: 'judy',   question: 'Which one is the original Judy Hopps in Zootopia?' },
      { id: 'nick',   question: 'Which one is the original Nick Wilde in Zootopia?' },
      { id: 'goofy',  question: 'Which one is the original Goofy in Mickey Mouse?' },
      { id: 'simba',  question: 'Which one is the original Simba in Lion King?' },
      { id: 'timon',  question: 'Which one is the original Timon in the Lion King?' }
    ];

    // Ungraded general-knowledge statements, shown after all the pictures (no time limit).
    // To remove this part, make the list empty: const KNOWLEDGE_CHECKS = [];
    const KNOWLEDGE_CHECKS = [];

    const imgPath = (item, v) => 'images/' + item.id + '_' + v.file + '.' + CONFIG.IMAGE_EXT;

    /* =====================================================================
       HELPERS
       ===================================================================== */
    const $card = document.getElementById('card');
    const $bar  = document.getElementById('bar');

    const participantId = (window.crypto && crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now()) + Math.random().toString(16).slice(2)
    ).slice(0, 8);

    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const shuffle = arr => {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    };

    const ARROW = '<svg viewBox="0 0 56 26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14 C 18 11, 34 13, 52 13"/><path d="M42 3 L 53 13 L 41 23"/></svg>';

    // If an image file is missing, show its filename so you can still test the flow.
    $card.addEventListener('error', e => {
      if (e.target.tagName === 'IMG') {
        const ph = document.createElement('div');
        ph.className = 'placeholder';
        ph.textContent = 'Missing image: ' + e.target.getAttribute('src');
        e.target.replaceWith(ph);
      }
    }, true);

    const img = (src, cls = '') => '<img class="' + cls + '" src="' + esc(src) + '" alt="">';

    function render(html) {
      $card.innerHTML = html;
      window.scrollTo(0, 0);
      $card.focus({ preventScroll: true });
    }

    function timerBar(ms) {
      return '<div class="timer" aria-hidden="true"><i style="animation-duration:' + ms + 'ms"></i></div>';
    }

    // Resolves with the data-value of the clicked button, or null if time runs out.
    function waitForButton(timeoutMs) {
      return new Promise(resolve => {
        let timer = null;
        const onClick = e => {
          const b = e.target.closest('button[data-value]');
          if (!b) return;
          cleanup();
          resolve(b.dataset.value);
        };
        const cleanup = () => {
          $card.removeEventListener('click', onClick);
          clearTimeout(timer);
        };
        $card.addEventListener('click', onClick);
        if (timeoutMs) timer = setTimeout(() => { cleanup(); resolve(null); }, timeoutMs);
      });
    }

    function setProgress(done, total) {
      $bar.style.width = Math.round((done / total) * 100) + '%';
    }

    /* =====================================================================
       DATA
       ===================================================================== */
    let saveData = true;   // becomes false in test mode

    function send(trials) {
      if (!saveData) {
        if (CONFIG.DEBUG) console.log('test mode, not saved', trials);
        return;
      }
      const payload = { participantId, trials };
      if (CONFIG.DEBUG) console.log('data', payload);
      if (!CONFIG.ENDPOINT) return;
      fetch(CONFIG.ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).catch(() => {});
    }

    /* =====================================================================
       SCREENS
       ===================================================================== */
    async function infoScreen(html, label) {
      const btn = label
        ? '<button class="btn" data-value="go">' + label + '</button>'
        : '<button class="next" data-value="go" aria-label="Continue">' + ARROW + '</button>';
      render('<div class="copy">' + html + '</div>' + btn);
      await waitForButton();
    }

    // Three pictures on one screen, in a random left-to-right order.
    async function askTrial(item) {
      const order = shuffle(VERSIONS);
      const pics = order.map((v, i) =>
        '<button class="pic" data-value="' + v.label + '" aria-label="Picture ' + (i + 1) + ' of 3">' +
          img(imgPath(item, v)) + '</button>').join('');
      render('<p class="question">' + esc(item.question) + '</p>' +
             '<div class="pics">' + pics + '</div>' +
             (CONFIG.TRIAL_MS ? timerBar(CONFIG.TRIAL_MS) : ''));
      const t0 = performance.now();
      const value = await waitForButton(CONFIG.TRIAL_MS);
      return {
        value,
        rt: Math.round(performance.now() - t0),
        order: order.map(v => v.label).join('-')   // left to right, saved in the "condition" column
      };
    }

    // 1 to 5, labeled at the two ends.
    async function askConfidence() {
      render('<p class="question">Rate Your Confidence</p>' +
        '<div class="conf">' +
          [1, 2, 3, 4, 5].map(n => '<button data-value="' + n + '"><strong>' + n + '</strong></button>').join('') +
        '</div>' +
        '<div class="conf-labels"><span>Least Confident</span><span>Most Confident</span></div>');
      return Number(await waitForButton());
    }

    async function askStatement(text) {
      render('<p class="statement">' + esc(text) + '</p>' +
        '<div class="row">' +
          '<button class="btn" data-value="True">True</button>' +
          '<button class="btn" data-value="False">False</button>' +
        '</div>');
      const t0 = performance.now();
      const value = await waitForButton();
      return { value, rt: Math.round(performance.now() - t0) };
    }

    async function timeUp() {
      render('<p class="question">Time\u2019s up.</p>');
      await sleep(900);
    }

    /* =====================================================================
       ONE ITEM
       ===================================================================== */
    async function runItem(item) {
      const res = await askTrial(item);

      if (res.value === null) {
        await timeUp();
        send([{ itemId: item.id, condition: res.order, answer: 'timeout', confidence: '', rtMs: res.rt }]);
        return;
      }

      const confidence = await askConfidence();
      send([{ itemId: item.id, condition: res.order, answer: res.value, confidence, rtMs: res.rt }]);
    }

    /* =====================================================================
       THE STUDY
       ===================================================================== */
    function preload() {
      ITEMS.forEach(it => VERSIONS.forEach(v => { const i = new Image(); i.src = imgPath(it, v); }));
    }

    async function main() {
      preload();
      setProgress(0, ITEMS.length);

      // Consent
      await infoScreen(
        '<h1>Icon memory study</h1>' +
        '<p>This is a short study (about 5 minutes) for a final research project in COGS 080 at Dartmouth College. ' +
        'You will see some images and answer questions about them.</p>' +
        '<p>Your answers are anonymous and you can stop at any time by closing this page. ' +
        'Please don\u2019t look anything up while you answer.</p>' +
        '<p class="small">Questions?: aynura.m.erejepbaeva.28@dartmouth.edu</p>',
        'Start the study');

      // Instructions
      await infoScreen(
        '<p class="question">You\u2019ll see some images and answer questions.<br>Answer about the original version of each item.</p>' +
        '<p>For each character you will see three pictures. Click the one you think is the original. ' +
        (CONFIG.TRIAL_MS ? 'You will have ' + (CONFIG.TRIAL_MS / 1000) + ' seconds for each one. ' : '') +
        'After each answer, you will rate how confident you are.</p>');

      // Personal questions
      render(
        '<p class="question">Answer these personal questions</p>' +
        '<div class="form">' +
          '<label>How much time do you spend on screen per day?' +
            '<select id="screen"><option value="">Choose one</option>' +
            '<option>Less than 2 hours</option><option>2\u20134 hours</option><option>4\u20136 hours</option>' +
            '<option>6\u20138 hours</option><option>More than 8 hours</option></select></label>' +
          '<label>Age (optional)<input id="age" type="number" min="18" max="120" inputmode="numeric"></label>' +
          '<label>Gender (optional)' +
            '<select id="gender"><option value="">Choose one</option><option>Woman</option><option>Man</option>' +
            '<option>Non-binary</option><option>Prefer to self-describe</option><option>Prefer not to say</option></select></label>' +
        '</div>' +
        '<button class="next" data-value="go" aria-label="Continue">' + ARROW + '</button>');
      await waitForButton();
      const screenTime = document.getElementById('screen').value;
      const age = document.getElementById('age').value;
      const gender = document.getElementById('gender').value;
      saveData = Boolean(screenTime || age || gender);   // all blank = test mode
      send([{ itemId: 'demographics', condition: 'info', confidence: '', rtMs: '',
              answer: JSON.stringify({ screenTime, age, gender }) }]);

      // Items
      for (let i = 0; i < ITEMS.length; i++) {
        await runItem(ITEMS[i]);
        setProgress(i + 1, ITEMS.length);
      }

      // General-knowledge statements (ungraded)
      if (KNOWLEDGE_CHECKS.length) {
        await infoScreen('<p class="question">Two quick general-knowledge questions.</p>');
        for (const k of KNOWLEDGE_CHECKS) {
          const r = await askStatement(k.text);
          send([{ itemId: 'knowledge_' + k.id, condition: 'knowledge', answer: r.value, confidence: '', rtMs: r.rt }]);
        }
      }

      // Open-ended questions
      render(
        '<div class="form">' +
          '<label>How did you come up with your answers?<textarea class="answer" id="how"></textarea></label>' +
          '<label>Did the provided images influence your answers?<textarea class="answer" id="infl"></textarea></label>' +
        '</div>' +
        '<button class="btn" data-value="go">Finish</button>');
      await waitForButton();
      send([
        { itemId: 'open_how', condition: 'open', answer: document.getElementById('how').value.trim(), confidence: '', rtMs: '' },
        { itemId: 'open_influence', condition: 'open', answer: document.getElementById('infl').value.trim(), confidence: '', rtMs: '' }
      ]);

      // Debrief
      render(
        '<div class="copy"><h1>Thank you!</h1>' +
        '<p>In each set, one picture was the original and two were edited on purpose. We are studying what kinds of mistakes ' +
        'people make when they remember familiar characters, and whether those mistakes follow what we know about a whole ' +
        'category of animals (for example, that monkeys have tails).</p>' +
        '<p>False memories tend to exist because of the way our brains process and store information. ' +
        'You can close this page now.</p></div>');
    }

    main();
  </script>
</body>
</html>
